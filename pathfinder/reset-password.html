<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173334">
  <title>Reset password | Pathfinder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <main class="login-layout">
    <section class="login-brand-panel" aria-label="Pathfinder">
      <a class="brand login-brand" href="login.html" aria-label="Pathfinder sign in">
        <span class="brand-icon">P</span>
        <span class="brand-copy"><strong>Pathfinder</strong><small>Asset Traceability</small></span>
      </a>
      <div class="login-brand-message">
        <span class="login-eyebrow">ACCOUNT RECOVERY</span>
        <h1>Secure access,<br>restored.</h1>
        <p>Choose a new password to get back to tracking your assets.</p>
      </div>
      <span class="login-brand-footer">Pathfinder · Asset Traceability</span>
    </section>

    <section class="login-form-panel">
      <form class="login-card" id="resetForm" novalidate>
        <span class="login-eyebrow">PASSWORD RESET</span>
        <h2>Choose a new password</h2>
        <p class="login-intro">Enter and confirm your new password below.</p>
        <div class="login-error" id="resetError" role="alert" hidden></div>
        <label class="login-label" for="newPassword">New password</label>
        <input class="login-input" id="newPassword" type="password" autocomplete="new-password" minlength="6" required>
        <label class="login-label password-confirm-label" for="confirmPassword">Confirm new password</label>
        <input class="login-input" id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required>
        <button class="login-submit" id="resetSubmit" type="submit">Reset password</button>
        <p class="login-switch"><a class="login-text-link" href="login.html">Back to sign in</a></p>
      </form>
    </section>
  </main>
  <script>
    if (window.location.protocol === 'file:') {
      window.location.replace(`http://127.0.0.1:3001/reset-password.html${window.location.search}`);
    }
    const configuredApiBase = localStorage.getItem('pathfinderApiBase');
    const isLocalPreview = window.location.protocol === 'file:'
      || (['localhost', '127.0.0.1', '[::1]'].includes(window.location.hostname)
        && window.location.port !== ''
        && window.location.port !== '3001');
    const API_BASE = (configuredApiBase || (isLocalPreview ? 'http://127.0.0.1:3001' : '')).replace(/\/$/, '');
    const resetForm = document.getElementById('resetForm');
    const resetError = document.getElementById('resetError');
    const resetToken = new URLSearchParams(window.location.search).get('oobCode')
      || new URLSearchParams(window.location.search).get('token')
      || '';

    function showResetError(message, isNotice = false) {
      resetError.textContent = message;
      resetError.classList.toggle('login-notice', isNotice);
      resetError.hidden = false;
    }

    if (resetToken.length < 6 || resetToken.length > 512) {
      showResetError('This password reset link is invalid or expired. Request another reset link.', true);
      document.getElementById('resetSubmit').disabled = true;
    }

    resetForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      resetError.hidden = true;
      if (!resetForm.reportValidity()) return;

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (newPassword !== confirmPassword) {
        showResetError('The passwords do not match.');
        return;
      }

      const button = document.getElementById('resetSubmit');
      button.disabled = true;
      button.textContent = 'Resetting…';
      let resetCompleted = false;
      try {
        const response = await fetch(`${API_BASE}/api/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: resetToken, newPassword })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Unable to reset your password.');
        localStorage.removeItem('pathfinderToken');
        localStorage.removeItem('pathfinderUser');
        showResetError(`${result.message} You can now sign in.`, true);
        resetForm.querySelectorAll('input, button').forEach((field) => { field.disabled = true; });
        resetCompleted = true;
      } catch (error) {
        showResetError(error.message || 'Unable to reach the Pathfinder service. Try again later.');
      } finally {
        if (!resetCompleted) {
          button.disabled = false;
          button.textContent = 'Reset password';
        }
      }
    });
  </script>
</body>
</html>
